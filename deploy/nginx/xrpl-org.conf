# xrpl-org.xrpl365.com - static snapshot of the xrpl-dev-portal Docs homepage and Infrastructure
# section, for copy review. Deployed to /etc/nginx/sites-available/xrpl-org (symlinked into
# sites-enabled). Content is published by scripts/deploy-preview.sh on the preview/xrpl-org-deploy
# branch. Cert: certbot webroot via /var/www/acme, like the xrpl365 vhost, with a deploy hook
# that reloads nginx on renewal.

server {
    listen 80; listen [::]:80;
    server_name xrpl-org.xrpl365.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl; listen [::]:443 ssl; http2 on;
    server_name xrpl-org.xrpl365.com;

    ssl_certificate /etc/letsencrypt/live/xrpl-org.xrpl365.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xrpl-org.xrpl365.com/privkey.pem;

    root /var/www/xrpl-org;
    index index.html;

    # A review copy of xrpl.org content: keep it out of search indexes. add_header does not
    # inherit into locations that set their own headers, so the assets block repeats it.
    add_header X-Robots-Tag "noindex, nofollow" always;

    location = / { return 302 /docs; }

    # Pages are saved as <path>/index.html; serve them at <path> without a trailing-slash hop,
    # which the site's client-side router would treat as a different route.
    location / { try_files $uri $uri/index.html =404; }

    # Hashed filenames from the site build, safe to cache hard.
    location /assets/ {
        expires 30d;
        access_log off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
